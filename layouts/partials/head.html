
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- 🔖 Dynamic title -->
<title>
  {{ if .IsHome }}
    {{ .Site.Title }} | {{ .Site.Params.tagline }}
  {{ else }}
    {{ .Title }} | {{ .Site.Title }}
  {{ end }}
</title>

<!-- ✅ Meta tags -->
<meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta name="author" content="{{ .Site.Params.author | default .Site.Params.name }}" />
<link rel="canonical" href="{{ .Permalink }}" />

<!-- 🌐 Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:locale" content="{{ site.Language.Lang }}" />
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }} | {{ .Site.Params.tagline }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}" />
<meta property="og:description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:image" content="{{ with .Params.og_image }}{{ . | absURL }}{{ else }}{{ with site.Params.og_image }}{{ . | absURL }}{{ end }}{{ end }}">
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:site_name" content="{{ .Site.Title }}" />

<!-- 🐦 Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }} | {{ .Site.Params.tagline }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}" />
<meta name="twitter:description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta name="twitter:image" content="{{ with .Params.og_image }}{{ . | absURL }}{{ else }}{{ with site.Params.og_image }}{{ . | absURL }}{{ end }}{{ end }}" />

<!-- 🔧 Favicon -->
<link rel="icon" href="/favicon.ico" sizes="any" />
{{ with site.Params.favicon_svg }}<link rel="icon" href="{{ . | relURL }}" type="image/svg+xml" />{{ end }}
{{ with site.Params.apple_touch_icon }}<link rel="apple-touch-icon" href="{{ . | relURL }}" />{{ end }}
{{ with site.Params.theme_color }}<meta name="theme-color" content="{{ . }}" />{{ end }}

<!-- Icons: no third-party CDN. The site serves the files itself (defaults below are local paths). -->
{{ with site.Params.fontawesome_css | default "/vendor/fontawesome/css/all.min.css" }}<link rel="stylesheet" href="{{ . }}" />{{ end }}
{{ with site.Params.devicon_css }}<link rel="stylesheet" href="{{ . }}" />{{ end }}
