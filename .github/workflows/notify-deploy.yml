name: Notify deploy

on:
  push:
    branches: [main]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger nykteo-deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          EVENT: theme-updated
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nykteo/nykteo-deploy/dispatches \
            -d "{\"event_type\":\"$EVENT\"}"
